name: Secrets

# The secret scan on its own (#220): every pull request, drafts too, and every push to main, with
# no path filter, so a pull request that changes only docs/, deploy/, the Dockerfile or a workflow
# is scanned as well (ci.yml skips those paths). One short job, about a minute a run (0006).
# By hand (workflow_dispatch), it scans the whole history of every branch and every pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request cancels its older run, which only scanned part of the same
# commits. Every other run has a group of its own: GitHub keeps only one waiting run per group, so
# a shared group could drop a push to main without scanning its commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Decision 0011: it only reads the repository and runs none of its code.
permissions:
  contents: read

jobs:
  scan:
    name: secret scan
    runs-on: ubuntu-latest
    # The whole history by hand takes longer than one push or pull request.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 15 || 5 }}
    steps:
      # The token isn't kept for later steps. The full history is for gitleaks.
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      # By hand: every pull request's head as well (the check-out has every branch and tag). The
      # repository is public, so this needs no token.
      - name: Fetch pull request heads
        if: github.event_name == 'workflow_dispatch'
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pull/*'

      # A pull request's own commits; on main, the commits of the push, or the whole history when
      # the push's first commit isn't known; by hand, every commit of every branch and pull request
      # except the snapshot branch (main's files, packed). The same pinned gitleaks (MIT) as
      # ci.yml, checksum checked first; findings are redacted in the log. A false positive, such as
      # a fictional password, gets a "gitleaks:allow" comment on its line, or its fingerprint
      # (printed in the log) in .gitleaksignore. Changes to .gitleaksignore or a gitleaks config
      # need a reviewer.
      - name: Secret scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          version=8.30.1
          sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_linux_x64.tar.gz"
          if ! echo "$sum  $dir/gitleaks.tar.gz" | sha256sum --check --status; then
            echo "The gitleaks $version download does not match its pinned checksum."
            exit 1
          fi
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          from="$BEFORE_SHA"
          if [ "$EVENT" = pull_request ]; then from="$BASE_SHA"; fi
          range="$HEAD_SHA"
          if [ "$EVENT" = workflow_dispatch ]; then
            range="--exclude=refs/remotes/origin/snapshot --all"
          elif [ -n "$from" ] && git cat-file -e "$from^{commit}" 2> /dev/null; then
            range="$from..$HEAD_SHA"
          elif [ "$EVENT" = pull_request ]; then
            range="-1 $HEAD_SHA"
          fi
          "$dir/gitleaks" git --no-banner --redact --verbose --log-opts="$range" .
