name: Image

# Builds the Docker image and smoke-tests it. Only main publishes it to GHCR
# (docs/decisions/0003-image-and-deploy.md). It runs only:
# - daily at 01:30 UTC on main, and stops early if that commit already has an image;
# - by hand (Actions > Image > Run workflow): on main it publishes, optionally with a
#   version tag like 0.1.0; on other branches it only builds and tests;
# - on a pull request when the "image" label is added: builds and tests, never publishes.
#   A pull request that changes only deploy/ (but not backup.sh) is validated without a build.
# Each job gets only the permissions it needs: building and testing has contents: read, and
# packages: write belongs to the publish job, which runs only on refs/heads/main.
# Nothing here deletes old image versions.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'On main, also tag the image with this version, like 0.1.0 (never overwritten)'
        type: string
        default: ''
  pull_request:
    types: [labeled]

# On a pull request a newer run for the same label cancels the older one. On main, runs
# wait for each other, so a publish is never cut short.
concurrency:
  group: image-${{ github.ref }}-${{ github.event.label.name || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/felipegonc-coder/navcc-carehub

jobs:
  # On main only: does this commit have an image yet, and is the version tag still free?
  registry:
    name: registry
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: read
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Check the registry
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          tag=sha-${GITHUB_SHA::7} exists=false build=true
          if [[ -n $VERSION && ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::The version must look like 1.2.3 or 1.2.3-rc.1."; exit 1
          fi
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          if [[ -n $VERSION ]] && docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION exists already. Version tags are never overwritten."; exit 1
          fi
          if docker buildx imagetools inspect "$IMAGE:$tag" >/dev/null 2>&1; then
            exists=true
            # For a version tag, this run still builds and tests an image of the commit.
            if [[ -z $VERSION ]]; then build=false; fi
          fi
          echo "$IMAGE:$tag exists: $exists. Build: $build."
          printf 'exists=%s\nbuild=%s\n' "$exists" "$build" >> "$GITHUB_OUTPUT"

  # Builds and tests with read-only access to the repository: no registry login, no push.
  image:
    name: image
    needs: registry
    if: >-
      ${{ !cancelled() && needs.registry.result != 'failure' && needs.registry.outputs.build != 'false' &&
      (github.event_name != 'pull_request' || github.event.label.name == 'image') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Check out
        id: checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false

      # Each run step keeps its output in $RUNNER_TEMP/ci-logs/<step id>.log for the report.
      - name: Plan
        id: plan
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          {
            head=${PR_HEAD:-$GITHUB_SHA}
            build=true tag=sha-${head::7}
            if [[ -n $VERSION && $GITHUB_REF != refs/heads/main ]]; then
              echo "::error::Version tags are published only from main."; exit 1
            fi
            if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
              changed=$(git diff --name-only HEAD^1 HEAD)
              printf 'Changed files:\n%s\n' "$changed"
              if ! grep -qv '^deploy/' <<<"$changed" && ! grep -qx 'deploy/backup.sh' <<<"$changed"; then
                build=false
                echo "Only deploy/ changed, not backup.sh: validating it without building the image."
              fi
            fi
            printf 'build=%s\ntag=%s\n' "$build" "$tag" | tee -a "$GITHUB_OUTPUT"
          } 2>&1 | tee "$RUNNER_TEMP/ci-logs/plan.log"

      - name: Validate deploy files
        id: validate
        run: |
          {
            cp deploy/.env.example deploy/.env
            docker compose -f deploy/docker-compose.yml config --quiet
            config=$(CAREHUB_BIND_ADDRESS=100.64.0.1 docker compose -f deploy/docker-compose.yml config)
            grep -q 'host_ip: 100.64.0.1' <<<"$config" \
              || { echo "::error::CAREHUB_BIND_ADDRESS does not reach Caddy's ports"; exit 1; }
            echo "docker-compose.yml is valid, with and without CAREHUB_BIND_ADDRESS."
            command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
            shellcheck -S warning deploy/*.sh
            echo "shellcheck found no warnings."
          } 2>&1 | tee "$RUNNER_TEMP/ci-logs/validate.log"

      # docker buildx reads the Actions cache URL and token from ACTIONS_* variables,
      # which only JavaScript actions get. This passes them on to the later steps.
      - name: Expose the Actions cache to docker buildx
        id: cache-env
        if: steps.plan.outputs.build == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            for (const [name, value] of Object.entries(process.env)) {
              if (name.startsWith('ACTIONS_')) core.exportVariable(name, value);
            }

      - name: Set up Docker Buildx
        id: buildx
        if: steps.plan.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build
        id: build
        if: steps.plan.outputs.build == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.tag }}
        run: |
          {
            docker buildx build --platform linux/amd64 --load --tag carehub:ci \
              --build-arg "CAREHUB_VERSION=$VERSION" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --cache-from type=gha,scope=image \
              --cache-to type=gha,scope=image,mode=max,ignore-error=true \
              --progress plain .
            docker image ls carehub:ci
          } 2>&1 | tee "$RUNNER_TEMP/ci-logs/build.log"

      - name: Smoke test
        id: smoke
        if: steps.plan.outputs.build == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.tag }}
        run: |
          {
            fail() { echo "::error::$*"; exit 1; }
            # Waits until container $1 is healthy; fails clearly after about 60 seconds.
            wait_healthy() {
              local state=""
              for _ in $(seq 30); do
                state=$(docker inspect -f '{{.State.Status}} {{.State.Health.Status}}' "$1")
                [[ $state == 'running healthy' ]] && return 0
                [[ $state == running* ]] || break
                sleep 2
              done
              docker logs --tail 80 "$1" 2>&1
              fail "$1 is not healthy ($state) after up to 60 seconds; its last log lines are above."
            }
            sql() { docker exec ci-db psql -X -q -t -A -v ON_ERROR_STOP=1 -U carehub -d carehub -c "$1"; }

            # Mounts as in deploy/docker-compose.yml: the app sees backups/ read-only, except
            # requests/, which belongs to its user (uid 1000).
            b=$RUNNER_TEMP/backups
            mkdir -p "$b/requests"
            sudo chown 1000:1000 "$b/requests"
            backup=(--network carehub-ci -v carehub-ci-files:/data/files -v "$b:/backups"
              -v "$PWD/deploy/backup.sh:/opt/carehub/backup.sh:ro"
              -e PGHOST=ci-db -e PGUSER=carehub -e PGPASSWORD=ci-only -e PGDATABASE=carehub
              --entrypoint bash postgres:17 /opt/carehub/backup.sh)

            docker network create carehub-ci
            docker run -d --name ci-db --network carehub-ci \
              -e POSTGRES_USER=carehub -e POSTGRES_DB=carehub -e POSTGRES_PASSWORD=ci-only \
              --health-cmd 'pg_isready -h 127.0.0.1 -U carehub -d carehub' --health-interval 2s postgres:17
            wait_healthy ci-db
            docker run -d --name ci-app --network carehub-ci --init -p 127.0.0.1:3000:3000 \
              -v carehub-ci-files:/data/files -v "$b:/data/backups:ro" -v "$b/requests:/data/backups/requests" \
              -e DATABASE_URL=postgres://carehub:ci-only@ci-db:5432/carehub \
              -e SESSION_SECRET="$(openssl rand -hex 32)" \
              -e CAREHUB_PUBLIC_URL=http://127.0.0.1:3000 -e COOKIE_SECURE=false carehub:ci
            wait_healthy ci-app

            curl -fsS -o health.json http://127.0.0.1:3000/api/health || fail 'GET /api/health failed'
            cat health.json; echo
            jq -e --arg v "$VERSION" '.status == "ok" and .version == $v' health.json >/dev/null \
              || fail "GET /api/health should report status ok and version $VERSION"
            curl -fsS -D page.headers -o page.html http://127.0.0.1:3000/ || fail 'GET / failed'
            grep -qi '^content-type: text/html' page.headers || fail 'GET / did not return HTML'
            grep -q '<title>Care Hub' page.html || fail 'GET / is not the Care Hub page'
            echo "GET /api/health and GET / work."

            # Some data, then a backup asked for the way the Status page will ask for one.
            sql 'CREATE TABLE ci_probe (id int); INSERT INTO ci_probe VALUES (1), (2);'
            docker exec -u node ci-app sh -c 'echo ci > /data/files/ci-probe.txt' \
              || fail 'the app cannot write to /data/files'
            docker exec -u node ci-app touch /data/backups/requests/now \
              || fail 'the app cannot ask for a backup in /data/backups/requests'
            docker run -d --name ci-backup --init -e BACKUP_AT=23:59 "${backup[@]}" schedule
            for _ in $(seq 30); do [[ -e $b/status.json ]] && break; sleep 2; done
            docker logs ci-backup 2>&1
            [[ -e $b/status.json ]] || fail 'the requested backup did not finish within 60 seconds'
            [[ ! -e $b/requests/now ]] || fail 'backup.sh did not remove requests/now'
            docker exec -u node ci-app cat /data/backups/status.json > status.json \
              || fail 'the app cannot read /data/backups/status.json'
            jq . status.json
            jq -e '.ok and .restoreTest.ok and .dbBytes > 0 and .filesBytes > 0
              and (.restoreTest.details | test(" [1-9][0-9]* rows"))' status.json >/dev/null \
              || fail 'the backup failed or its restore test did not check out'
            stamp=$(jq -r '.startedAt | gsub("[-:]"; "")' status.json)
            cmp -s status.json "$b/runs/$stamp.json" || fail "runs/$stamp.json should match status.json"
            [[ -f $b/carehub-$stamp.sha256 ]] || fail "backup $stamp has no checksum file"
            # The app sees the backup files but must not be able to read them.
            for f in db.dump files.tar.gz; do
              if docker exec -u node ci-app cat "/data/backups/carehub-$stamp.$f" >/dev/null 2>&1; then
                fail "the app can read carehub-$stamp.$f"
              fi
            done

            # A second request within 60 minutes of the last backup is dropped.
            docker exec -u node ci-app touch /data/backups/requests/now
            for _ in $(seq 25); do [[ -e $b/requests/now ]] || break; sleep 2; done
            docker logs --tail 1 ci-backup 2>&1
            [[ ! -e $b/requests/now ]] || fail 'backup.sh did not pick up the second request'
            runs=("$b"/runs/*.json)
            (( ${#runs[@]} == 1 )) || fail 'backup.sh ran a second backup within 60 minutes'
            docker stop ci-backup >/dev/null

            # Lose the data, then put the backup back with the app stopped, as restore.sh does.
            sql 'DROP TABLE ci_probe;'
            docker exec ci-app rm /data/files/ci-probe.txt
            docker stop ci-app >/dev/null
            docker run --rm "${backup[@]}" restore "$stamp" --confirmed \
              || fail "the restore of $stamp failed (exit $?)"
            docker start ci-app >/dev/null
            wait_healthy ci-app
            [[ $(sql 'SELECT count(*) FROM ci_probe;') == 2 ]] \
              || fail 'the restore did not bring back the table ci_probe'
            [[ $(docker exec ci-app cat /data/files/ci-probe.txt) == ci ]] \
              || fail 'the restore did not bring back the uploaded file'
            ls "$b"/pre-restore-*.db.dump >/dev/null || fail 'the restore did not save the data it replaced'
            echo "The requested backup checked out, and restoring it brought back the table and the file."
          } 2>&1 | tee "$RUNNER_TEMP/ci-logs/smoke.log"

      # The publish job pushes exactly this tested image.
      - name: Save the image for the publish job
        id: save
        if: steps.plan.outputs.build == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          {
            docker save carehub:ci | gzip -1 > "$RUNNER_TEMP/carehub.tar.gz"
            ls -l "$RUNNER_TEMP/carehub.tar.gz"
          } 2>&1 | tee "$RUNNER_TEMP/ci-logs/save.log"

      - name: Upload the image
        id: upload-image
        if: steps.save.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/carehub.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          overwrite: true

      # On a pull request, the report job posts these.
      - name: Keep the logs for the report
        id: keep-logs
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
        run: mkdir -p "$RUNNER_TEMP/ci-logs" && printf '%s\n' "$STEPS_JSON" > "$RUNNER_TEMP/ci-logs/steps.json"

      - name: Upload the logs
        id: upload-logs
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: image-logs
          path: ${{ runner.temp }}/ci-logs
          retention-days: 1
          overwrite: true

  # On main only, after the image passed: pushes that same image. The only job that may
  # write packages; it doesn't check out or run code from the repository.
  publish:
    name: publish
    needs: [registry, image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@v4
        with:
          name: image
          path: ${{ runner.temp }}/image

      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.image.outputs.tag }}
          EXISTS: ${{ needs.registry.outputs.exists }}
          VERSION: ${{ inputs.version }}
        run: |
          docker load -i "$RUNNER_TEMP/image/carehub.tar.gz"
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          tags=()
          # A commit that has an image already (a run for a version tag) keeps its tags.
          if [[ $EXISTS != true ]]; then tags+=("$TAG" latest); fi
          if [[ -n $VERSION ]]; then
            if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
              echo "::error::$IMAGE:$VERSION exists already. Version tags are never overwritten."; exit 1
            fi
            tags+=("$VERSION")
          fi
          for tag in "${tags[@]}"; do
            docker tag carehub:ci "$IMAGE:$tag"
            docker push --quiet "$IMAGE:$tag"
          done
          echo "Pushed $IMAGE with the tags: ${tags[*]}"

  # Posts or updates one comment on the pull request with the result, next to the CI report:
  # agents' tokens can't read check runs. It doesn't check out or run code from the pull request.
  report:
    name: report
    needs: image
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.image.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download the logs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: image-logs
          path: ci-logs

      - name: Report on the pull request
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.image.result }}
          BUILT: ${{ needs.image.outputs.build }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- carehub-image-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const read = (file) => (fs.existsSync(file) ? fs.readFileSync(file, 'utf8').trimEnd() : '');
            const steps = JSON.parse(read('ci-logs/steps.json') || '{}');
            const failed = Object.keys(steps).filter((id) => steps[id].outcome === 'failure');
            if (process.env.RESULT !== 'success' && !failed.length) failed.push('image');
            const section = (id) => {
              const log = read(`ci-logs/${id}.log`);
              if (!log) return `\`${id}\` failed before writing a log; see the [run](${run}).`;
              const tail = log.split('\n').slice(-120).join('\n').slice(-25000);
              return `<details open>\n<summary><code>${id}</code>: last 120 lines</summary>\n\n\`\`\`\`text\n${tail}\n\`\`\`\`\n\n</details>`;
            };
            const done = process.env.BUILT === 'true' ? 'built and smoke-tested with a backup and a restore, not pushed' : 'deploy/ validated, no build needed';
            const body = failed.length
              ? [marker, `### ❌ Image failed on ${sha}: ${failed.map((id) => `\`${id}\``).join(', ')}`, `[Run](${run})`, ...failed.map(section)].join('\n\n')
              : `${marker}\n\n### ✅ Image passed on ${sha}: ${done}\n\n[Run](${run})`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const old = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
