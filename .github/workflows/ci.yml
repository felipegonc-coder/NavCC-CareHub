name: CI

# Quick checks only (docs/decisions/0006-ci-within-free-minutes.md). Builds and browser tests
# run in e2e.yml and image.yml.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/image.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/image.yml'

# A newer push cancels the older run on the same branch, on main too.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Decision 0011: the checks job runs the pull request's code, so it can only read. The report job
# can write one comment and doesn't check out or run that code.
permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Step outcomes for the report job.
    outputs:
      steps: ${{ toJSON(steps) }}
    # The server tests need Postgres. Each test file creates (and drops) its own database.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: carehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/carehub_test
    defaults:
      run:
        shell: bash
    steps:
      # The token isn't kept for later steps. The full history is for gitleaks.
      - name: Check out
        id: checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Cache npm downloads
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'apps/*/package.json', 'packages/*/package.json', 'tests/*/package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      # Every @carehub/* package must be one of this repository's workspaces, never a download from
      # the npm registry (#75). It needs only Node, so it runs before the install, and a failure
      # skips the install and the checks that need it.
      - name: Workspace check
        id: workspaces
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          { node --test --test-reporter=dot scripts/check-workspaces.test.mjs && node scripts/check-workspaces.mjs; } 2>&1 \
            | tee "$RUNNER_TEMP/ci-logs/workspaces.log"

      # Without install scripts (decision 0011). npm ci needs a lockfile in sync with every
      # package.json; when a pull request adds a dependency without updating it, npm install is
      # the fallback.
      - name: Install
        id: install
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          log="$RUNNER_TEMP/ci-logs/install.log"
          if npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee "$log"; then exit 0; fi
          if ! grep -q 'can only install' "$log"; then exit 1; fi
          echo '::warning::package-lock.json does not match package.json, so this run used npm install. The repo bot updates the lockfile after merge.'
          npm install --ignore-scripts --no-audit --no-fund 2>&1 | tee -a "$log"

      # Each check runs even if an earlier one failed (not if install failed) and keeps its
      # output in $RUNNER_TEMP/ci-logs/<step id>.log for the report job.
      - name: Type check
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee "$RUNNER_TEMP/ci-logs/typecheck.log"

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint 2>&1 | tee "$RUNNER_TEMP/ci-logs/lint.log"

      - name: Unit tests
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test 2>&1 | tee "$RUNNER_TEMP/ci-logs/test.log"

      - name: License check
        id: license
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run license:check 2>&1 | tee "$RUNNER_TEMP/ci-logs/license.log"

      # Known vulnerabilities in shipped packages (decision 0011): critical fails the run. High and
      # critical go to the job summary, and to the report once ci-report.mjs reads
      # REPORT_EXTRA_FILE (#4). Dev tools are left out. The repository's .npmrc turns audit off
      # for installs, so this step turns it on.
      - name: Audit
        id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          npm_config_audit: 'true'
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit.json" || true
          jq -r '
            [(.vulnerabilities // {}) | to_entries[] | select(.value.severity == "high" or .value.severity == "critical")]
            | select(length > 0)
            | "**npm audit:** \(length) shipped package(s) with high or critical vulnerabilities", "",
              (.[] | "- `\(.key)` \(.value.range) (\(.value.severity)): \([.value.via[] | if type == "object" then .title else "via \(.)" end] | unique | join("; "))")
          ' "$RUNNER_TEMP/audit.json" > "$RUNNER_TEMP/ci-logs/audit.md" || true
          cat "$RUNNER_TEMP/ci-logs/audit.md" >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=critical 2>&1 | tee "$RUNNER_TEMP/ci-logs/audit.log"

      # Secrets in the pull request's commits, with a pinned gitleaks (MIT) for Linux x64, the
      # runner's platform, whose checksum is checked first. Findings are redacted in the log. A
      # false positive, such as a fictional password, gets a "gitleaks:allow" comment on its line,
      # or its fingerprint (printed in the log) in .gitleaksignore.
      - name: Secret scan
        id: gitleaks
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.checkout.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          version=8.30.1
          sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir" "$RUNNER_TEMP/ci-logs"
          curl -fsSL --retry 3 -o "$dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_linux_x64.tar.gz"
          if ! echo "$sum  $dir/gitleaks.tar.gz" | sha256sum --check --status; then
            echo "The gitleaks $version download does not match its pinned checksum." | tee "$RUNNER_TEMP/ci-logs/gitleaks.log"
            exit 1
          fi
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          "$dir/gitleaks" git --no-banner --redact --verbose --log-opts="$BASE_SHA..$HEAD_SHA" . 2>&1 \
            | tee "$RUNNER_TEMP/ci-logs/gitleaks.log"

      # Keep this step last: the report job reads these logs.
      - name: Keep the logs for the report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: ${{ runner.temp }}/ci-logs
          retention-days: 1
          overwrite: true

  # On a pull request, posts or updates one comment with the result: the end of each failed
  # step's log, or that everything passed. It runs the base branch's ci-report.mjs, not the pull
  # request's, and treats the logs as text.
  report:
    name: report
    needs: checks
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the report script from the base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download the logs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ci-logs
          path: ${{ runner.temp }}/ci-logs

      - name: Report on the pull request
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STEPS_JSON: ${{ needs.checks.outputs.steps || '{}' }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          REPORT_EXTRA_FILE: ${{ runner.temp }}/ci-logs/audit.md
        run: |
          # A checks job that failed without a failed step (a timeout, a lost runner) still shows as failed.
          if [ "$CHECKS_RESULT" != success ] && ! jq -e 'any(.[]; .outcome == "failure")' <<< "$STEPS_JSON" > /dev/null; then
            STEPS_JSON=$(jq -c '. + {checks: {outcome: "failure", conclusion: "failure"}}' <<< "$STEPS_JSON")
          fi
          node .github/scripts/ci-report.mjs
